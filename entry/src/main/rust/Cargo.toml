[package]
name = "rustdesk_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "rustdesk_core"
crate-type = ["staticlib"]

[dependencies]
hbb_common = { path = "vendor/hbb_common", features = ["webrtc"] }
kcp-sys = { git = "https://github.com/rustdesk-org/kcp-sys", branch = "rustdesk-patches" }

libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "sync"] }
log = "0.4"
protobuf = "3"

[patch.crates-io]
machine-uid = { path = "vendor/machine_uid" }
webrtc-util = { path = "vendor/webrtc_util_ohos" }
webrtc-sctp = { git = "https://github.com/rustdesk-org/webrtc", rev = "db3b07a9dd8f195916c89c2e62a8911402b11d27" }

[patch."https://github.com/rustdesk-org/webrtc"]
webrtc-util = { path = "vendor/webrtc_util_ohos" }

[profile.release]
opt-level = "z"
lto = true
strip = true
